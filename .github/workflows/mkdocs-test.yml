name: mkdocs-test

on: pull_request

jobs:
  test-docs-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the API repo
        uses: actions/checkout@v4
        with:
          repository: logicalclocks/hopsworks-api
          ref: ${{ github.base_ref }}
          path: hopsworks-api

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true

      - name: Install Python dependencies
        run: uv sync --extra cli

      # The Helm values pages are filled by gen-helm-values at build time and
      # never committed. A committed copy is published as-is whenever a build
      # leaves the page alone (no matching chart in Nexus yet), so the check
      # resets every page to its placeholder and fails if that changed one.
      - name: Check the Helm values pages hold only their placeholders
        run: |
          hopsworks-docs reset-helm-values
          if ! git diff --exit-code --stat -- docs/setup_installation/common/helm_chart_values/; then
            echo "::error::Generated Helm values content is committed in docs/setup_installation/common/helm_chart_values/ (files above)."
            echo "Those pages are generated during the documentation build and must hold only their placeholder."
            echo "To fix it, in your branch run:"
            echo "  uv run --extra cli hopsworks-docs reset-helm-values"
            echo "  git add docs/setup_installation/common/helm_chart_values/"
            echo "  git commit -m 'Reset the Helm values pages to their placeholders'"
            echo "The reset keeps any edit outside the generated block (a page title, its intro line, a new page)."
            echo "To preview the values locally, run gen-helm-values, then the reset above before committing."
            exit 1
          fi

      - name: Install Hopsworks Python API
        run: uv pip install hopsworks-api/python

      - name: Install Ubuntu dependencies
        run: sudo apt update && sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Markdownlint
        run: hopsworks-docs markdownlint

      - name: Snakeoil (Python code blocks in markdown)
        run: hopsworks-docs snakeoil

      - name: Generate Helm values reference
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          BASE_REF: ${{ github.base_ref }}
        # --strict turns the generator's warnings (a subchart without a page, an
        # upstream chart without a docs link, a missing common value or RonDB
        # schema, a RonDB override the schema does not declare) into a failed
        # PR check; the deploy workflow only warns.
        run: |
          if [ "$BASE_REF" = "main" ]; then
            # dev docs: latest chart from the (private) dev channel. Fork PRs do
            # not receive secrets, so skip (keep the page placeholder) when the
            # Nexus credentials are absent rather than failing the build.
            if [ -n "$NEXUS_USER" ]; then
              hopsworks-docs gen-helm-values --strict \
                --repo-url https://nexus.hops.works/repository/hopsworks-helm-dev
            else
              echo "Nexus credentials not available (e.g. a fork PR); keeping the values reference placeholder."
            fi
          else
            # release docs: latest patch of the chart version (major.minor) for this docs version.
            # The released repo is public, so fetch anonymously (clear any creds).
            NEXUS_USER= NEXUS_PASSWORD= hopsworks-docs gen-helm-values --strict \
              --repo-url https://nexus.hops.works/repository/hopsworks-helm \
              --chart-version "${BASE_REF#branch-}"
          fi

      - name: Check mkdocs warnings
        run: hopsworks-docs check

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('java/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build javadoc documentation
        working-directory: hopsworks-api/java
        # The spark-4.1 profile pins the Hops Spark fork (4.1.3.0). Its
        # artifacts are public (nexus.hops.works/repository/spark), but their
        # poms depend on io.hops:hadoop-client-* and io.hops.hive:* hosted in
        # the authenticated hops-artifacts repository, which CI cannot access,
        # so CI overrides spark.version to build against upstream Apache Spark
        # instead. The Hops Hudi fork bundles resolve anonymously from the open
        # nexus.hops.works/repository/hudi, so no hudi override is needed.
        # Do not drop the spark.version override: without it the build fails
        # with 401 Unauthorized on io.hops:hadoop-client-api.
        run: mvn clean install javadoc:javadoc javadoc:aggregate -Pspark-4.1 -DskipTests -Dspark.version=4.1.3 && cp -r target/site/apidocs ../../docs/javadoc

      - name: Check for broken links
        run: hopsworks-docs linkchecker

      - name: Setup git for mike
        run: |
          git config --global user.name Mike
          git config --global user.email mike@docs.hopsworks.ai

      - name: Generate the docs with mike
        run: mike deploy test-version
