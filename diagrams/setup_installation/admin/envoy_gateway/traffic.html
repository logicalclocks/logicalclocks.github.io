<figure class="hops-diagram hops-viz hops-viz-static">
<svg viewBox="0 0 768 300" role="img" aria-label="How inference requests reach a deployment with Envoy Gateway turned on. Clients keep calling the Istio ingress gateway at the same URL. Istio sends Knative-mode deployments' traffic straight to them, as before, and forwards Standard-mode deployments' traffic to Envoy Gateway, which routes it with Gateway API HTTPRoutes." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="eg-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/></marker>
    <marker id="eg-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- the Hopsworks cluster -->
  <rect class="viz-zone" data-tone="accent" x="168" y="16" width="584" height="268" rx="6"/>
  <path class="viz-kv-header" d="M168 22 a6 6 0 0 1 6 -6 h572 a6 6 0 0 1 6 6 v20 h-584 z"/>
  <text class="viz-kv-title" x="184" y="35">Hopsworks cluster</text>

  <!-- edges -->
  <path class="viz-edge" d="M136 162 L200 162" marker-start="url(#eg-knob)" marker-end="url(#eg-arrow)"/>
  <path class="viz-edge" d="M344 150 L364 150 Q384 150 384 130 L384 110 Q384 90 404 90 L568 90" marker-start="url(#eg-knob)" marker-end="url(#eg-arrow)"/>
  <path class="viz-edge" d="M344 174 L364 174 Q384 174 384 194 L384 214 Q384 234 404 234 L424 234" marker-start="url(#eg-knob)" marker-end="url(#eg-arrow)"/>
  <path class="viz-edge" d="M568 234 L592 234" marker-start="url(#eg-knob)" marker-end="url(#eg-arrow)"/>

  <g>
    <rect class="viz-node" x="16" y="136" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="76" y="158" text-anchor="middle">Client</text>
    <text class="viz-node-subtitle" x="76" y="176" text-anchor="middle">same URL</text>
  </g>
  <g>
    <rect class="viz-node" x="200" y="136" width="144" height="52" rx="4"/>
    <text class="viz-node-title" x="272" y="158" text-anchor="middle">Istio</text>
    <text class="viz-node-subtitle" x="272" y="176" text-anchor="middle">front door</text>
  </g>
  <g>
    <rect class="viz-node" x="568" y="64" width="168" height="52" rx="4"/>
    <text class="viz-node-title" x="652" y="86" text-anchor="middle">Knative mode</text>
    <text class="viz-node-subtitle" x="652" y="104" text-anchor="middle">unchanged</text>
  </g>
  <g data-tone="data">
    <rect class="viz-node" x="424" y="208" width="144" height="52" rx="4"/>
    <text class="viz-node-title" x="496" y="230" text-anchor="middle">Envoy Gateway</text>
    <text class="viz-node-subtitle" x="496" y="248" text-anchor="middle">Gateway API</text>
  </g>
  <g data-tone="data">
    <rect class="viz-node" x="592" y="208" width="144" height="52" rx="4"/>
    <text class="viz-node-title" x="664" y="230" text-anchor="middle">Standard mode</text>
    <text class="viz-node-subtitle" x="664" y="248" text-anchor="middle">HTTPRoutes</text>
  </g>
</svg>
</figure>
