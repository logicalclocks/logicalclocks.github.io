<figure class="hops-diagram hops-viz hops-viz-static">
<svg viewBox="0 0 616 400" role="img" aria-label="Deployment status transitions. Creating leads to created, then starting, then running. Running moves to idle when scaled to zero and back, to updating on a change and back, and to stopping then stopped on a stop; a stopped deployment can be started again. Starting, running and updating can fail; a failed deployment can be updated or stopped." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ds-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/></marker>
    <marker id="ds-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- creation, then the start / run / stop / stopped loop -->
  <path class="viz-edge" d="M200 50 L256 50" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M324 76 L324 130" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M324 170 L324 224" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M256 250 L200 250" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M132 230 L132 176" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M200 142 L256 142" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>

  <!-- running: idle and updating, both ways -->
  <path class="viz-edge" d="M392 242 L448 242" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M448 258 L392 258" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M308 276 L308 330" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M340 330 L340 276" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M516 276 V344 Q516 350 510 350 H392" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>

  <!-- failure: from starting, running and updating; out to updating or stopped -->
  <path class="viz-edge" d="M256 342 L200 342" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M200 358 L256 358" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M272 276 V294 Q272 300 266 300 H176 Q170 300 170 306 V324" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M272 130 V106 Q272 100 266 100 H30 Q24 100 24 106 V360 Q24 366 30 366 H64" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>
  <path class="viz-edge" d="M64 334 H46 Q40 334 40 328 V164 Q40 158 46 158 H64" marker-start="url(#ds-knob)" marker-end="url(#ds-arrow)"/>

  <g>
    <rect class="viz-node viz-ghost" x="64" y="30" width="136" height="40" rx="4"/>
    <text class="viz-node-title" x="132" y="54" text-anchor="middle">CREATING</text>
  </g>
  <g>
    <rect class="viz-node" x="256" y="24" width="136" height="52" rx="4"/>
    <text class="viz-node-title" x="324" y="47" text-anchor="middle">CREATED</text>
    <text class="viz-node-subtitle" x="324" y="64" text-anchor="middle">never started</text>
  </g>
  <g>
    <rect class="viz-node" x="64" y="124" width="136" height="52" rx="4"/>
    <text class="viz-node-title" x="132" y="147" text-anchor="middle">STOPPED</text>
    <text class="viz-node-subtitle" x="132" y="164" text-anchor="middle">no resources</text>
  </g>
  <g>
    <rect class="viz-node viz-ghost" x="256" y="130" width="136" height="40" rx="4"/>
    <text class="viz-node-title" x="324" y="154" text-anchor="middle">STARTING</text>
  </g>
  <g>
    <rect class="viz-node viz-ghost" x="64" y="230" width="136" height="40" rx="4"/>
    <text class="viz-node-title" x="132" y="254" text-anchor="middle">STOPPING</text>
  </g>
  <g data-tone="accent" data-state="active">
    <rect class="viz-node" x="256" y="224" width="136" height="52" rx="4"/>
    <text class="viz-node-title" x="324" y="247" text-anchor="middle">RUNNING</text>
    <text class="viz-node-subtitle" x="324" y="264" text-anchor="middle">serving</text>
  </g>
  <g data-tone="accent" data-state="active">
    <rect class="viz-node" x="448" y="224" width="136" height="52" rx="4"/>
    <text class="viz-node-title" x="516" y="247" text-anchor="middle">IDLE</text>
    <text class="viz-node-subtitle" x="516" y="264" text-anchor="middle">scaled to zero</text>
  </g>
  <g data-tone="error" data-state="active">
    <rect class="viz-node" x="64" y="324" width="136" height="52" rx="4"/>
    <text class="viz-node-title" x="132" y="347" text-anchor="middle">FAILED</text>
    <text class="viz-node-subtitle" x="132" y="364" text-anchor="middle">terminal</text>
  </g>
  <g data-tone="warn">
    <rect class="viz-node viz-ghost" x="256" y="330" width="136" height="40" rx="4" style="stroke:var(--viz-tone)"/>
    <text class="viz-node-title" x="324" y="354" text-anchor="middle">UPDATING</text>
  </g>
</svg>
</figure>
