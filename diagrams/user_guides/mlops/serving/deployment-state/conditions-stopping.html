<figure class="hops-diagram hops-viz hops-viz-static">
<svg viewBox="0 0 720 116" role="img" aria-label="Condition transitions while a deployment stops. Whatever the current condition, a stop moves it to scheduled with status unknown, then to stopped, unknown while resources are released and true once they are gone." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dx-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/></marker>
    <marker id="dx-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <path class="viz-edge" d="M256 58 L296 58" marker-start="url(#dx-knob)" marker-end="url(#dx-arrow)"/>
  <text class="viz-meta" x="276" y="48" text-anchor="middle">stop</text>
  <path class="viz-edge" d="M472 58 L512 58" marker-start="url(#dx-knob)" marker-end="url(#dx-arrow)"/>

  <g>
    <rect class="viz-node" x="24" y="32" width="232" height="52" rx="4"/>
    <text class="viz-node-title" x="140" y="55" text-anchor="middle">CURRENT CONDITION</text>
    <text class="viz-node-subtitle" x="140" y="72" text-anchor="middle">true or false</text>
  </g>
  <g>
    <rect class="viz-node" x="296" y="32" width="176" height="52" rx="4"/>
    <text class="viz-node-title" x="384" y="55" text-anchor="middle">SCHEDULED</text>
    <text class="viz-node-subtitle" x="384" y="72" text-anchor="middle">unknown</text>
  </g>
  <g>
    <rect class="viz-node" x="512" y="32" width="176" height="52" rx="4"/>
    <text class="viz-node-title" x="600" y="55" text-anchor="middle">STOPPED</text>
    <text class="viz-node-subtitle" x="600" y="72" text-anchor="middle">unknown, then true</text>
  </g>
</svg>
</figure>
