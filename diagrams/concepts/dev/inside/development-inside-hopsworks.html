<svg viewBox="0 0 640 572" role="img" aria-label="Development inside Hopsworks. Three ways in: the browser (develop and run remotely), a local IDE such as PyCharm or IntelliJ (develop locally, run remotely), and CI/CD pipelines with GitHub Actions or Jenkins. Inside Hopsworks: library management with conda, PyPI and Docker; source control with GitHub, GitLab and Bitbucket; Python and Spark jobs, which a Jupyter notebook can also run as; Airflow workflows that orchestrate the jobs; and logs and monitoring with OpenSearch, Grafana and Prometheus; a browser terminal with the hops CLI, Claude Code and Codex preinstalled; and the Wizard, which guides an end-to-end build and hands a kickoff prompt to the terminal." xmlns="http://www.w3.org/2000/svg">
