<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 760 280" role="img" aria-label="Animated diagram of validation and statistics on write. An fg.insert dataframe reaches the expectation suite, Great Expectations runs, the validation report rows turn to pass one by one, and the feature statistics are recomputed, both surfaced in the Hopsworks UI." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="st-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="st-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <path class="viz-edge" d="M184 132 H242" marker-end="url(#st-arrow)" marker-start="url(#st-knob)"/>
  <path class="viz-edge" d="M450 114 C 480 100 490 90 512 80" marker-end="url(#st-arrow)" marker-start="url(#st-knob)"/>
  <path class="viz-edge" d="M450 150 C 480 164 490 174 512 184" marker-end="url(#st-arrow)" marker-start="url(#st-knob)"/>

  <g>
    <rect class="viz-node" x="24" y="100" width="160" height="64" rx="4"/>
    <text class="viz-node-title" x="104" y="126" text-anchor="middle">CLIENT</text>
    <text class="viz-node-subtitle" x="104" y="146" text-anchor="middle">fg.insert(df)</text>
  </g>

  <g id="st-suite" data-tone="accent">
    <rect class="viz-node" x="250" y="100" width="200" height="64" rx="4"/>
    <text class="viz-node-title" x="350" y="126" text-anchor="middle">EXPECTATION SUITE</text>
    <text class="viz-node-subtitle" x="350" y="146" text-anchor="middle">great expectations</text>
  </g>

  <rect class="viz-kv-frame" x="520" y="24" width="220" height="104" rx="6"/>
  <path class="viz-kv-header" d="M520 30 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v20 h-220 z"/>
  <text class="viz-kv-title" x="528" y="43">Validation report</text>
  <g id="st-r1" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="526" y="58" width="208" height="26" rx="3"/>
    <text class="viz-kv-key" x="532" y="75">amount ≥ 0</text>
    <text id="st-v1" class="viz-kv-val" x="726" y="75" text-anchor="end">–</text>
  </g>
  <g id="st-r2" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="526" y="88" width="208" height="26" rx="3"/>
    <text class="viz-kv-key" x="532" y="105">cc_num not null</text>
    <text id="st-v2" class="viz-kv-val" x="726" y="105" text-anchor="end">–</text>
  </g>

  <rect class="viz-kv-frame" x="520" y="152" width="220" height="100" rx="6"/>
  <path class="viz-kv-header" d="M520 158 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v20 h-220 z"/>
  <text class="viz-kv-title" x="528" y="171">Statistics</text>
  <g id="st-r3" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="526" y="186" width="208" height="26" rx="3"/>
    <text class="viz-kv-key" x="532" y="203">amount · mean</text>
    <text id="st-v3" class="viz-kv-val" x="726" y="203" text-anchor="end">–</text>
  </g>
  <text class="viz-meta" x="528" y="234">recomputed on every write</text>

  <text id="st-ok" class="viz-meta viz-fade" data-tone="accent" x="350" y="200" text-anchor="middle" style="opacity:0">both surfaced in the hopsworks ui</text>

  <g transform="translate(190 123)">
    <g id="st-p" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="44" height="18" rx="3"/>
      <text x="22" y="9" text-anchor="middle">df</text>
    </g>
  </g>
</svg>
<script type="application/json" data-viz-scene>
{
  "interval": 750,
  "loopDelay": 2200,
  "steps": [
    { "#st-p": {"opacity": 1} },
    { "#st-p": {"x": 140}, "$ms": 600 },
    { "#st-p": {"opacity": 0}, "#st-suite": {"state": "active"}, "$ms": 700 },
    { "#st-r1": {"state": "active"}, "#st-v1": {"text": "pass"}, "$ms": 550 },
    { "#st-r2": {"state": "active"}, "#st-v2": {"text": "pass"}, "$ms": 550 },
    { "#st-r3": {"state": "active"}, "#st-v3": {"text": "27.4"}, "#st-suite": {"state": null}, "$ms": 800 },
    { "#st-r1": {"state": "visited"}, "#st-r2": {"state": "visited"}, "#st-r3": {"state": "visited"}, "#st-ok": {"opacity": 1}, "$ms": 2000 }
  ]
}
</script>
</figure>
