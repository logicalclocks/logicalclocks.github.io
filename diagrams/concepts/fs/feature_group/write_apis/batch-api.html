<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 1000 400" role="img" aria-label="Animated diagram of the Batch API write path for Spark clients. A dataframe enters HSFS and splits: online rows go through Kafka into the online store on RonDB, while the large backfill writes directly to the Hudi tables of the offline store over the HDFS API, skipping Kafka to avoid write amplification." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="wb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity=".4"/>
    </marker>
  </defs>

  <path class="viz-edge" d="M174 202 H222" marker-end="url(#wb-arrow)"/>
  <path class="viz-edge" d="M380 190 C412 190 418 124 442 124" marker-end="url(#wb-arrow)"/>
  <path class="viz-edge" d="M590 124 C645 124 650 95 692 95" marker-end="url(#wb-arrow)"/>
  <path class="viz-edge" d="M380 214 C540 214 560 305 692 305" marker-end="url(#wb-arrow)"/>
  <text class="viz-meta" x="540" y="248" text-anchor="middle">HDFS API · direct write</text>

  <g class="viz-node-group">
    <rect class="viz-node" x="24" y="170" width="150" height="64" rx="8"/>
    <text class="viz-node-title" x="99" y="196" text-anchor="middle">SPARK CLIENT</text>
    <text class="viz-node-subtitle" x="99" y="216" text-anchor="middle">large backfills</text>
  </g>
  <g class="viz-node-group">
    <rect class="viz-node" x="230" y="170" width="150" height="64" rx="8"/>
    <text class="viz-node-title" x="305" y="196" text-anchor="middle">HSFS</text>
    <text class="viz-node-subtitle" x="305" y="216" text-anchor="middle">splits the write</text>
  </g>
  <g id="wb-kafka" class="viz-node-group" data-tone="data">
    <rect class="viz-node" x="450" y="96" width="140" height="56" rx="8"/>
    <text class="viz-node-title" x="520" y="118" text-anchor="middle">KAFKA</text>
    <text class="viz-node-subtitle" x="520" y="136" text-anchor="middle">online path</text>
  </g>

  <rect class="viz-kv-frame" x="700" y="40" width="276" height="110" rx="6"/>
  <rect class="viz-kv-header" x="700" y="40" width="276" height="26"/>
  <text class="viz-kv-title" x="712" y="57">Online store</text>
  <text class="viz-meta" x="964" y="57" text-anchor="end">RonDB</text>
  <g id="wb-row-on" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="708" y="74" width="260" height="26" rx="3"/>
    <text class="viz-kv-key" x="716" y="91">amount_sum</text>
    <text id="wb-von" class="viz-kv-val" x="960" y="91" text-anchor="end">–</text>
  </g>
  <text class="viz-meta" x="712" y="120">latest values only</text>

  <rect class="viz-kv-frame" x="700" y="250" width="276" height="120" rx="6"/>
  <rect class="viz-kv-header" x="700" y="250" width="276" height="26"/>
  <text class="viz-kv-title" x="712" y="267">Offline store</text>
  <text class="viz-meta" x="964" y="267" text-anchor="end">Hudi · S3/ADLS/GCS/HopsFS</text>
  <g id="wb-row-off" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="708" y="284" width="260" height="26" rx="3"/>
    <text class="viz-kv-key" x="716" y="301">hudi commit</text>
    <text id="wb-voff" class="viz-kv-val" x="960" y="301" text-anchor="end">–</text>
  </g>
  <text id="wb-note" class="viz-meta viz-fade" x="712" y="330" style="opacity:0">backfill skips Kafka → no write amplification</text>

  <g transform="translate(156 193)">
    <g id="wb-p1" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="40" height="18" rx="3"/>
      <text x="20" y="9" text-anchor="middle">df</text>
    </g>
  </g>
  <g transform="translate(362 106)">
    <g id="wb-p2" class="viz-packet" data-tone="data" style="opacity:0">
      <rect width="48" height="18" rx="3"/>
      <text x="24" y="9" text-anchor="middle">rows</text>
    </g>
  </g>
  <g transform="translate(575 115)">
    <g id="wb-p3" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="48" height="18" rx="3"/>
      <text x="24" y="9" text-anchor="middle">rows</text>
    </g>
  </g>
  <g transform="translate(362 205)">
    <g id="wb-p4" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="70" height="18" rx="3"/>
      <text x="35" y="9" text-anchor="middle">backfill</text>
    </g>
  </g>
</svg>
