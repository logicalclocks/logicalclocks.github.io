<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 1000 400" role="img" aria-label="Animated diagram of the Stream API write path. A dataframe travels from the client into HSFS, is encoded as Avro and produced to a Kafka topic with at-least-once delivery. Kafka fans out to both stores: rows upsert into the online store on RonDB and commit into the offline store on Hudi. A duplicate Kafka delivery then reaches the online store and resolves as an idempotent no-op, which is how at-least-once transport becomes exactly-once in both stores." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ws-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity=".4"/>
    </marker>
  </defs>

  <text class="viz-meta" x="500" y="26" text-anchor="middle">one avro schema, both stores</text>

  <path class="viz-edge" d="M174 202 H222" marker-end="url(#ws-arrow)"/>
  <path class="viz-edge" d="M380 202 H442" marker-end="url(#ws-arrow)"/>
  <path class="viz-edge" d="M590 202 C650 202 650 100 692 100" marker-end="url(#ws-arrow)"/>
  <path class="viz-edge" d="M590 202 C650 202 650 300 692 300" marker-end="url(#ws-arrow)"/>

  <g class="viz-node-group">
    <rect class="viz-node" x="24" y="170" width="150" height="64" rx="8"/>
    <text class="viz-node-title" x="99" y="196" text-anchor="middle">CLIENT</text>
    <text class="viz-node-subtitle" x="99" y="216" text-anchor="middle">python · spark · flink</text>
  </g>
  <g class="viz-node-group">
    <rect class="viz-node" x="230" y="170" width="150" height="64" rx="8"/>
    <text class="viz-node-title" x="305" y="196" text-anchor="middle">HSFS</text>
    <text class="viz-node-subtitle" x="305" y="216" text-anchor="middle">avro encode</text>
  </g>
  <g id="ws-kafka" class="viz-node-group" data-tone="data">
    <rect class="viz-node" x="450" y="170" width="140" height="64" rx="8"/>
    <text class="viz-node-title" x="520" y="196" text-anchor="middle">KAFKA</text>
    <text class="viz-node-subtitle" x="520" y="216" text-anchor="middle">at-least-once</text>
  </g>

  <rect class="viz-kv-frame" x="700" y="40" width="276" height="120" rx="6"/>
  <rect class="viz-kv-header" x="700" y="40" width="276" height="26"/>
  <text class="viz-kv-title" x="712" y="57">Online store</text>
  <text class="viz-meta" x="964" y="57" text-anchor="end">RonDB</text>
  <g id="ws-row-on" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="708" y="74" width="260" height="26" rx="3"/>
    <text class="viz-kv-key" x="716" y="91">amount_sum</text>
    <text id="ws-von" class="viz-kv-val" x="960" y="91" text-anchor="end">–</text>
  </g>
  <text class="viz-meta" x="712" y="120">idempotent upsert → exactly-once</text>
  <text id="ws-noop" class="viz-meta viz-fade" x="712" y="140" style="opacity:0">duplicate delivery → no-op</text>

  <rect class="viz-kv-frame" x="700" y="240" width="276" height="120" rx="6"/>
  <rect class="viz-kv-header" x="700" y="240" width="276" height="26"/>
  <text class="viz-kv-title" x="712" y="257">Offline store</text>
  <text class="viz-meta" x="964" y="257" text-anchor="end">Hudi · S3/ADLS/GCS/HopsFS</text>
  <g id="ws-row-off" class="viz-kv-entry" data-tone="write">
    <rect class="viz-kv-cell" x="708" y="274" width="260" height="26" rx="3"/>
    <text class="viz-kv-key" x="716" y="291">hudi commit</text>
    <text id="ws-voff" class="viz-kv-val" x="960" y="291" text-anchor="end">–</text>
  </g>
  <text class="viz-meta" x="712" y="320">dedup on commit → exactly-once</text>

  <g transform="translate(156 193)">
    <g id="ws-p1" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="40" height="18" rx="3"/>
      <text x="20" y="9" text-anchor="middle">df</text>
    </g>
  </g>
  <g transform="translate(362 193)">
    <g id="ws-p2" class="viz-packet" data-tone="data" style="opacity:0">
      <rect width="54" height="18" rx="3"/>
      <text x="27" y="9" text-anchor="middle">avro</text>
    </g>
  </g>
  <g transform="translate(575 193)">
    <g id="ws-p3" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="48" height="18" rx="3"/>
      <text x="24" y="9" text-anchor="middle">rows</text>
    </g>
  </g>
  <g transform="translate(575 193)">
    <g id="ws-p4" class="viz-packet" data-tone="write" style="opacity:0">
      <rect width="48" height="18" rx="3"/>
      <text x="24" y="9" text-anchor="middle">rows</text>
    </g>
  </g>
  <g transform="translate(575 193)">
    <g id="ws-p5" class="viz-packet" data-tone="warn" style="opacity:0">
      <rect width="44" height="18" rx="3"/>
      <text x="22" y="9" text-anchor="middle">dup</text>
    </g>
  </g>
</svg>
