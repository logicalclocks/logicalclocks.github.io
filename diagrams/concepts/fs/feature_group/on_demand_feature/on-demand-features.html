<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 800 528" role="img" aria-label="Animated diagram of an on-demand feature. At the top, the Python definition of the zipcode UDF: decorated with hopsworks.udf, it takes longitude and latitude and returns the postcode from a reverse geocode. Below it, that one function sits between two pipelines. In the feature pipeline, historical rows pass through the UDF and the computed zipcode lands in the feature store. At request time, the online inference pipeline sends the request longitude and latitude through the same UDF, and the fresh zipcode is merged into the feature vector together with precomputed features read from the store. Same function in both places, so there is no skew." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="od-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="od-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- the on-demand feature function, defined once -->
  <rect class="viz-code-box" x="40" y="24" width="720" height="110" rx="6"/>
  <text class="viz-codeln" x="56" y="45">@hopsworks.<tspan class="tok-fn">udf</tspan>(return_type=str, mode=<tspan class="tok-str">"python"</tspan>)</text>
  <text class="viz-codeln" x="56" y="63"><tspan class="tok-kw">def</tspan> <tspan class="tok-fn">zipcode</tspan>(longitude, latitude):</text>
  <text class="viz-codeln" x="88" y="81">geolocator = <tspan class="tok-fn">Nominatim</tspan>(user_agent=<tspan class="tok-str">"house_prices"</tspan>)</text>
  <text class="viz-codeln" x="88" y="99">location = geolocator.<tspan class="tok-fn">reverse</tspan>((latitude, longitude))</text>
  <text class="viz-codeln" x="88" y="117"><tspan class="tok-kw">return</tspan> location.raw[<tspan class="tok-str">"address"</tspan>][<tspan class="tok-str">"postcode"</tspan>]</text>
  <text class="viz-meta" x="744" y="45" text-anchor="end">one definition, two call sites</text>

  <text class="viz-label" x="24" y="158">Feature pipeline · backfill</text>
  <text class="viz-label" x="24" y="416">Online inference · request time</text>
