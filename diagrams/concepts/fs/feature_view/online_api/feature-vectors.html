<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 760 250" role="img" aria-label="Animated diagram of get_feature_vector as a request and response. The request passes the serving key location_id 9844-3333. The response is a feature vector rendered as an ordered list of values, temperature, rainfall, pressure, that builds through a pipeline: lookup from the online store fills 12.45 and 44, plus passed merges the client value 1013, ODT the on-demand transformation rewrites it to 0.50, MDT the model-dependent transformation scales the whole list to 0.31, 0.87, 0.42, and the list is returned without the serving key. A caption notes that ODT runs before MDT, MDT is always last, and the serving key stays in the request and out of the returned list." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ov-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="ov-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- ===== request / response: the feature vector is a list ===== -->
  <rect class="viz-code-box" x="40" y="24" width="680" height="70" rx="6"/>
  <text class="viz-codeln" x="58" y="52">fv.<tspan class="tok-fn">get_feature_vector</tspan>({<tspan class="tok-str">"location_id"</tspan>: <tspan class="tok-str">"9844-3333"</tspan>})</text>
  <text class="viz-codeln" x="58" y="78">&#8594; <tspan id="ov-arr" style="fill:var(--hops-accent-text);font-weight:700">[ null, null, null ]</tspan></text>
  <text class="viz-meta" x="380" y="114" text-anchor="middle">positions in the list: temperature, rainfall, pressure</text>

  <!-- ===== the fixed-order build pipeline (arrows = the order) ===== -->
  <path class="viz-edge" d="M156 176 L172 176" marker-end="url(#ov-arrow)" marker-start="url(#ov-knob)"/>
  <path class="viz-edge" d="M292 176 L308 176" marker-end="url(#ov-arrow)" marker-start="url(#ov-knob)"/>
  <path class="viz-edge" d="M428 176 L444 176" marker-end="url(#ov-arrow)" marker-start="url(#ov-knob)"/>
  <path class="viz-edge" d="M564 176 L580 176" marker-end="url(#ov-arrow)" marker-start="url(#ov-knob)"/>

  <g id="s1" data-tone="data">
    <rect class="viz-node" x="36" y="150" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="96" y="174" text-anchor="middle">lookup</text>
    <text class="viz-node-subtitle" x="96" y="192" text-anchor="middle">online store</text>
  </g>
  <g id="s2" data-tone="data">
    <rect class="viz-node" x="172" y="150" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="232" y="174" text-anchor="middle">+ passed</text>
    <text class="viz-node-subtitle" x="232" y="192" text-anchor="middle">from client</text>
  </g>
  <g id="s3" data-tone="write">
    <rect class="viz-node" x="308" y="150" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="368" y="174" text-anchor="middle">ODT</text>
    <text class="viz-node-subtitle" x="368" y="192" text-anchor="middle">on-demand</text>
  </g>
  <g id="s4" data-tone="write">
    <rect class="viz-node" x="444" y="150" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="504" y="174" text-anchor="middle">MDT</text>
    <text class="viz-node-subtitle" x="504" y="192" text-anchor="middle">model-dep</text>
  </g>
  <g id="s5" data-tone="accent">
    <rect class="viz-node" x="580" y="150" width="120" height="52" rx="4"/>
    <text class="viz-node-title" x="640" y="174" text-anchor="middle">return</text>
    <text class="viz-node-subtitle" x="640" y="192" text-anchor="middle">list &#183; no key</text>
  </g>

  <!-- ===== constraint ===== -->
  <text id="cap" class="viz-meta viz-fade" x="380" y="232" text-anchor="middle" style="opacity:0">ODT before MDT, MDT last; the serving key stays in the request, not the returned list</text>
</svg>
<script type="application/json" data-viz-scene>
{
  "interval": 850,
  "loopDelay": 2600,
  "steps": [
    { "#s1": {"state": "active"}, "#ov-arr": {"text": "[ 12.45, 44, null ]"}, "$ms": 1000 },
    { "#s1": {"state": "visited"}, "#s2": {"state": "active"}, "#ov-arr": {"text": "[ 12.45, 44, 1013 ]"}, "$ms": 1000 },
    { "#s2": {"state": "visited"}, "#s3": {"state": "active"}, "#ov-arr": {"text": "[ 12.45, 44, 0.50 ]"}, "$ms": 1000 },
    { "#s3": {"state": "visited"}, "#s4": {"state": "active"}, "#ov-arr": {"text": "[ 0.31, 0.87, 0.42 ]"}, "$ms": 1100 },
    { "#s4": {"state": "visited"}, "#s5": {"state": "active"}, "#cap": {"opacity": 1}, "$ms": 2400 }
  ]
}
</script>
</figure>
