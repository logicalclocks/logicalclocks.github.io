<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 820 742" role="img" aria-label="Animated pipeline in Python: one feature-view definition carries its transformation into two lanes. Two feature groups are joined by a foreign key; product_feature_group is the label feature group (root), holding the label sales and the primary key product_id. create_feature_view names the view product_sales, sets labels to sales, and attaches a normalize transformation. The resulting feature view forks into an OFFLINE lane and an ONLINE lane. Offline, create_train_validation_test_split applies an extra_filter category == perfumes and 80/10/10 splits, then normalize(44) computes 0.78, producing product_sales_training_data_v1. Online, get_feature_vector retrieves by the serving key product_id=222 with no filter applied, then the same normalize with the same statistics computes 0.78, returning the product_sales_feature_vector: category perfumes, name d'odour, sold_prev_week 0.78. Both lanes end on the identical transformed value, showing consistent transformations and no train/serve skew." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="fvf-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
  </defs>

  <!-- ============ DEFINITION ============ -->
  <!-- source feature groups; product_feature_group is the label (root) FG -->
  <g id="fg-a" data-tone="data">
    <rect class="viz-node" x="124" y="8" width="226" height="54" rx="4"/>
    <text class="viz-node-title" x="237" y="30" text-anchor="middle">product_feature_group</text>
    <text class="viz-node-subtitle" x="237" y="48" text-anchor="middle">label feature group &#183; root</text>
  </g>
  <g id="fg-b" data-tone="data">
    <rect class="viz-node" x="436" y="8" width="264" height="54" rx="4"/>
    <text class="viz-node-title" x="568" y="39" text-anchor="middle">order_weekly_feature_group</text>
  </g>
  <path id="join-dash" class="viz-edge" data-from="fg-a" data-from-side="right" data-to="fg-b" data-to-side="left" data-route="straight" style="stroke-dasharray:4 4;opacity:0"/>
  <text id="join-lbl" class="viz-meta" x="392" y="31" text-anchor="middle" style="opacity:0">join</text>
  <path id="e-a" class="viz-edge" data-from="fg-a" data-from-side="bottom" data-to="def-box" data-to-side="top" data-to-x="380" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <path id="e-b" class="viz-edge" data-from="fg-b" data-from-side="bottom" data-to="def-box" data-to-side="top" data-to-x="440" marker-end="url(#fvf-arrow)" style="opacity:0"/>

  <!-- create_feature_view -->
  <rect id="def-box" class="viz-code-box" x="222" y="94" width="378" height="124" rx="6" style="opacity:0"/>
  <text id="dl1" class="viz-codeln" x="240" y="116" style="opacity:0">fv = fs.<tspan class="tok-fn">create_feature_view</tspan>(</text>
  <text id="dl2" class="viz-codeln" x="240" y="134" style="opacity:0"><tspan> </tspan>   name=<tspan class="tok-str">"product_sales"</tspan>,</text>
  <text id="dl3" class="viz-codeln" x="240" y="152" style="opacity:0"><tspan> </tspan>   query=query,</text>
  <text id="dl4" class="viz-codeln" x="240" y="170" style="opacity:0"><tspan> </tspan>   labels=[<tspan class="tok-str">"sales"</tspan>],</text>
  <text id="dl5" class="viz-codeln" x="240" y="188" style="opacity:0"><tspan> </tspan>   transformation_functions=[normalize],</text>
  <text id="dl6" class="viz-codeln" x="240" y="206" style="opacity:0">)</text>

  <path id="e-fv" class="viz-edge" data-from="def-box" data-from-side="bottom" data-to="fview" data-to-side="top" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <g id="fview" data-tone="accent" style="opacity:0">
    <rect class="viz-node" x="278" y="252" width="264" height="56" rx="4"/>
    <text class="viz-node-title" x="410" y="276" text-anchor="middle">product_sales_feature_view</text>
    <text class="viz-node-subtitle" x="410" y="294" text-anchor="middle">one definition &#183; two uses</text>
  </g>

  <!-- fork into the two lanes -->
  <path id="e-off" class="viz-edge" data-from="fview" data-from-side="bottom" data-to="off-box" data-to-side="top" data-to-x="212" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <path id="e-on" class="viz-edge" data-from="fview" data-from-side="bottom" data-to="on-box" data-to-side="top" data-to-x="608" marker-end="url(#fvf-arrow)" style="opacity:0"/>

  <!-- ============ OFFLINE lane ============ -->
  <g id="z-off" style="opacity:0">
    <rect class="viz-zone" x="20" y="342" width="384" height="316" rx="6"/>
    <text class="viz-label" x="36" y="366">OFFLINE</text>
    <text class="viz-meta" x="36" y="382">batch &#183; training data</text>
  </g>
  <rect id="off-box" class="viz-code-box" x="36" y="398" width="352" height="82" rx="6" style="opacity:0"/>
  <text id="ol1" class="viz-codeln" x="50" y="420" style="opacity:0">fv.<tspan class="tok-fn">create_train_validation_test_split</tspan>(</text>
  <text id="ol2" class="viz-codeln" x="50" y="438" style="opacity:0"><tspan> </tspan>   validation_size=0.1, test_size=0.1,</text>
  <text id="ol3" class="viz-codeln" x="50" y="456" style="opacity:0"><tspan> </tspan>   extra_filter=category == <tspan class="tok-str">"perfumes"</tspan>,</text>
  <text id="ol4" class="viz-codeln" x="50" y="474" style="opacity:0">)</text>

  <path id="e-off1" class="viz-edge" data-from="off-box" data-from-side="bottom" data-to="off-tbox" data-to-side="top" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <g id="off-tbox" style="opacity:0">
    <rect class="viz-code-box" x="88" y="492" width="248" height="44" rx="6"/>
    <text class="viz-codeln" x="132" y="510"><tspan class="tok-fn">normalize</tspan>(44) &#8594; </text>
    <text id="off-val" class="viz-codeln" x="259" y="510" style="fill:var(--hops-accent-text);font-weight:700;opacity:0">0.78</text>
    <text class="viz-meta" x="212" y="528" text-anchor="middle">fit on training-set stats</text>
  </g>
  <path id="e-off2" class="viz-edge" data-from="off-tbox" data-from-side="bottom" data-to="off-out" data-to-side="top" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <g id="off-out" data-tone="write" style="opacity:0">
    <rect class="viz-node" x="36" y="556" width="352" height="60" rx="4"/>
    <g class="viz-icon" transform="translate(52,570) scale(0.58)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9 H21 M3 14 H21"/></g>
    <text class="viz-node-title" x="216" y="580" text-anchor="middle">product_sales_training_data_v1</text>
    <text class="viz-meta" x="216" y="600" text-anchor="middle">sold_prev_week = <tspan style="fill:var(--hops-accent-text);font-weight:700">0.78</tspan> (normalized)</text>
  </g>

  <!-- ============ ONLINE lane ============ -->
  <g id="z-on" style="opacity:0">
    <rect class="viz-zone" x="416" y="342" width="384" height="316" rx="6"/>
    <text class="viz-label" x="432" y="366">ONLINE</text>
    <text class="viz-meta" x="432" y="382">real-time &#183; serving</text>
  </g>
  <rect id="on-box" class="viz-code-box" x="432" y="398" width="352" height="82" rx="6" style="opacity:0"/>
  <text id="nl1" class="viz-codeln" x="446" y="420" style="opacity:0">vec = fv.<tspan class="tok-fn">get_feature_vector</tspan>(</text>
  <text id="nl2" class="viz-codeln" x="446" y="438" style="opacity:0"><tspan> </tspan>   entry={<tspan class="tok-str">"product_id"</tspan>: 222},</text>
  <text id="nl3" class="viz-codeln" x="446" y="456" style="opacity:0">)</text>
  <text id="nl4" class="viz-codeln" x="446" y="474" style="opacity:0;fill:var(--viz-ink-soft)"># serving key &#183; filter not applied</text>

  <path id="e-on1" class="viz-edge" data-from="on-box" data-from-side="bottom" data-to="on-tbox" data-to-side="top" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <g id="on-tbox" style="opacity:0">
    <rect class="viz-code-box" x="484" y="492" width="248" height="44" rx="6"/>
    <text class="viz-codeln" x="528" y="510"><tspan class="tok-fn">normalize</tspan>(44) &#8594; </text>
    <text id="on-val" class="viz-codeln" x="655" y="510" style="fill:var(--hops-accent-text);font-weight:700;opacity:0">0.78</text>
    <text class="viz-meta" x="608" y="528" text-anchor="middle">same stats &#183; init_serving(v1)</text>
  </g>
  <path id="e-on2" class="viz-edge" data-from="on-tbox" data-from-side="bottom" data-to="on-out" data-to-side="top" marker-end="url(#fvf-arrow)" style="opacity:0"/>
  <g id="on-out" data-tone="data" style="opacity:0">
    <rect class="viz-node" x="428" y="556" width="360" height="76" rx="4"/>
    <text class="viz-node-title" x="608" y="576" text-anchor="middle">product_sales_feature_vector</text>
    <g><rect class="viz-kv-cell" x="440" y="586" width="104" height="34" rx="3"/><text class="viz-colhead" x="492" y="600" text-anchor="middle">category</text><text class="viz-field-type" x="492" y="614" text-anchor="middle">perfumes</text></g>
    <g><rect class="viz-kv-cell" x="552" y="586" width="86" height="34" rx="3"/><text class="viz-colhead" x="595" y="600" text-anchor="middle">name</text><text class="viz-field-type" x="595" y="614" text-anchor="middle">d&#8217;odour</text></g>
    <g><rect class="viz-kv-cell" x="646" y="586" width="130" height="34" rx="3"/><text class="viz-colhead" x="711" y="600" text-anchor="middle">sold_prev_week</text><text class="viz-field-type" x="711" y="614" text-anchor="middle" style="fill:var(--hops-accent-text);font-weight:700">0.78</text></g>
  </g>

  <!-- ============ consistency callout ============ -->
  <path id="e-b1" class="viz-edge" data-tone="accent" data-from="off-out" data-from-side="bottom" data-from-x="212" data-to="banner" data-to-side="top" data-to-x="300" style="stroke-dasharray:4 4;opacity:0"/>
  <path id="e-b2" class="viz-edge" data-tone="accent" data-from="on-out" data-from-side="bottom" data-from-x="608" data-to="banner" data-to-side="top" data-to-x="520" style="stroke-dasharray:4 4;opacity:0"/>
  <g id="banner" data-tone="accent" style="opacity:0">
    <rect class="viz-node" x="134" y="674" width="552" height="48" rx="6" style="fill:var(--viz-tone-fill-solid);stroke:var(--viz-tone)"/>
    <text class="viz-label" x="410" y="696" text-anchor="middle">CONSISTENT TRANSFORMATIONS</text>
    <text class="viz-meta" x="410" y="713" text-anchor="middle">same normalize &#183; same training-set statistics &#183; no train/serve skew</text>
  </g>
</svg>
