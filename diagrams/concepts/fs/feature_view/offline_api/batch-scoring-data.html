<figure class="hops-diagram hops-viz">
<svg viewBox="0 0 820 210" role="img" aria-label="Animated diagram of batch scoring data. One feature view, product_sales_feature_view, spans a single timeline that runs left to right toward now. An early window is materialized once as TrainingData v1, shown in green. Then get_batch_data slices a daily window from the same feature view for scoring: a blue window at 2022-03-30 produces a batch DataFrame, then the window advances one day to 2022-03-31, leaving the previous day's window behind, and so on up to now, the default end_time. A caption states that get_batch_data with a start_time and end_time slices a time range from the feature view." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bsd-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="bsd-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- feature view: one timeline you slice from -->
  <rect class="viz-node" x="20" y="20" width="780" height="110" rx="6"/>
  <text class="viz-node-title" x="410" y="42" text-anchor="middle">product_sales_feature_view</text>
  <path class="viz-edge" d="M44 86 H772" marker-end="url(#bsd-arrow)" marker-start="url(#bsd-knob)"/>
  <text class="viz-edge-label viz-meta" x="762" y="78" text-anchor="end">time</text>
  <path class="viz-edge viz-fade" data-variant="lane" data-tone="data" d="M748 58 V114"/>
  <text class="viz-meta" data-tone="data" x="748" y="126" text-anchor="middle">now</text>

  <!-- training window: materialized once from an early range -->
  <rect id="tw" class="viz-window" data-tone="write" x="52" y="58" width="236" height="56" rx="6"/>
  <text class="viz-node-title" x="170" y="152" text-anchor="middle">TrainingData v1</text>
  <text id="twm" class="viz-meta viz-fade" x="170" y="168" text-anchor="middle" style="opacity:0">trained once on history</text>

  <!-- previous day's batch window, left behind as the scoring window advances -->
  <rect id="trace" class="viz-window viz-fade" data-tone="data" x="440" y="58" width="104" height="56" rx="6" style="opacity:0"/>

  <!-- batch scoring window: get_batch_data(start_time, end_time), advances daily -->
  <g id="batch" style="opacity:0">
    <rect id="bw" class="viz-window" data-tone="data" x="440" y="58" width="104" height="56" rx="6"/>
    <text class="viz-node-title" x="492" y="152" text-anchor="middle">Batch scoring</text>
    <text id="bdate" class="viz-meta" x="492" y="168" text-anchor="middle">2022-03-30</text>
  </g>

  <text id="cap" class="viz-meta viz-fade" x="410" y="196" text-anchor="middle" style="opacity:0">get_batch_data(start_time, end_time) slices a time range from the feature view</text>
</svg>
<script type="application/json" data-viz-scene>
{
  "interval": 800,
  "loopDelay": 2800,
  "steps": [
    { "#tw": {"state": "active"}, "#twm": {"opacity": 1}, "$ms": 900 },
    { "#tw": {"state": "visited"}, "#batch": {"opacity": 1}, "#bw": {"state": "active"}, "$ms": 1200 },
    { "#trace": {"opacity": 0.4}, "#batch": {"x": 150}, "#bdate": {"text": "2022-03-31"}, "$ms": 1200 },
    { "#cap": {"opacity": 1}, "$ms": 2600 }
  ]
}
</script>
</figure>
