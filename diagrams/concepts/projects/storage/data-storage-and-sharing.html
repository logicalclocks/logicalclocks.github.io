<figure class="hops-diagram hops-viz hops-viz-static">
<svg viewBox="0 0 560 470" role="img" aria-label="Two Hopsworks projects, Production and Development, each a governed sandbox holding its own private ML assets: training data, feature store, model registry, model deployments and a vector index. Development keeps its own feature store and additionally reads Production's feature store, shared into it read-only through an ACL without copying the data. ML Engineers own production; data scientists, data engineers and ML engineers own development. A shared CI/CD process links the two environments." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="st-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="st-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle class="viz-edge-knob" cx="5" cy="5" r="3"/>
    </marker>
  </defs>

  <!-- stakeholders (actors) -->
  <g><rect class="viz-node" x="40" y="8" width="200" height="56" rx="4"/>
    <g class="viz-icon" transform="translate(80,27) scale(0.7)"><circle cx="12" cy="-3.5" r="4"/><path d="M5 8 C5 3.5 8 1.5 12 1.5 C16 1.5 19 3.5 19 8"/></g>
    <text class="viz-node-title" x="106" y="40">ML Engineers</text></g>
  <g><rect class="viz-node" x="320" y="8" width="200" height="56" rx="4"/>
    <g class="viz-icon" transform="translate(356,27) scale(0.7)"><circle cx="12" cy="-3.5" r="4"/><path d="M5 8 C5 3.5 8 1.5 12 1.5 C16 1.5 19 3.5 19 8"/></g>
    <text class="viz-field" x="382" y="24">Data Scientists</text>
    <text class="viz-field" x="382" y="39">Data Engineers</text>
    <text class="viz-field" x="382" y="54">ML Engineers</text></g>

  <!-- CI/CD process (COMPUTE family: box + pill) -->
  <g data-tone="accent">
    <rect class="viz-node" x="226" y="88" width="108" height="40" rx="4"/>
    <rect class="viz-pill" x="250" y="80" width="60" height="16" rx="3"/>
    <text class="viz-pill-text" x="280" y="91" text-anchor="middle">Process</text>
    <g class="viz-icon" transform="translate(246,100) scale(0.7)"><path d="M6 12 A6 6 0 0 1 17 9"/><path d="M17 4 V9 H12"/><path d="M18 12 A6 6 0 0 1 7 15"/><path d="M7 20 V15 H12"/></g>
    <text class="viz-node-title" x="272" y="112">CI/CD</text>
  </g>

  <!-- ownership + CI/CD flows -->
  <path class="viz-edge" d="M140 64 L140 150" marker-start="url(#st-knob)" marker-end="url(#st-arrow)"/>
  <path class="viz-edge" d="M420 64 L420 150" marker-start="url(#st-knob)" marker-end="url(#st-arrow)"/>
  <path class="viz-edge" d="M226 108 C214.3 108 168 122.3 168 134 L168 150" marker-start="url(#st-knob)" marker-end="url(#st-arrow)" style="stroke-dasharray:5 4"/>
  <path class="viz-edge" d="M334 108 C345.7 108 392 122.3 392 134 L392 150" marker-start="url(#st-knob)" marker-end="url(#st-arrow)" style="stroke-dasharray:5 4"/>

  <!-- production project (DATA family: table of linked ML assets) -->
  <g>
    <rect class="viz-kv-frame" x="40" y="150" width="200" height="255" rx="6"/>
    <path class="viz-kv-header" d="M40 156 a6 6 0 0 1 6 -6 h188 a6 6 0 0 1 6 6 v24 h-200 z"/>
    <text class="viz-kv-title" x="56" y="172">Production</text>
    <text class="viz-meta" x="224" y="172" text-anchor="end">private</text>
    <a class="viz-link" href="../../fs/feature_view/offline_api/">
      <g class="viz-icon" transform="translate(54,195) scale(0.6)"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9 H21 M12 9 V21"/></g>
      <text class="viz-field" x="80" y="207">Training Data</text></a>
    <line class="viz-row-sep" x1="40" y1="225" x2="240" y2="225"/>
    <a class="viz-link" href="../../fs/feature_group/fg_overview/">
      <g class="viz-icon" transform="translate(54,240) scale(0.6)"><rect x="8" y="8" width="12.5" height="13" rx="2"/><path d="M4.5 17 V6 A2 2 0 0 1 6.5 4 H15.5"/></g>
      <text class="viz-field" x="80" y="252">Feature Store</text></a>
    <line class="viz-row-sep" x1="40" y1="270" x2="240" y2="270"/>
    <a class="viz-link" href="../../mlops/registry/">
      <g class="viz-icon" transform="translate(54,285) scale(0.6)"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M3 7 L12 12 L21 7 M12 12 V22"/></g>
      <text class="viz-field" x="80" y="297">Model Registry</text></a>
    <line class="viz-row-sep" x1="40" y1="315" x2="240" y2="315"/>
    <a class="viz-link" href="../../mlops/serving/">
      <g class="viz-icon" transform="translate(54,330) scale(0.6)"><rect x="4" y="5" width="16" height="6" rx="1.5"/><rect x="4" y="13" width="16" height="6" rx="1.5"/><path d="M7.5 8 H7.51 M7.5 16 H7.51"/></g>
      <text class="viz-field" x="80" y="342">Model Deployments</text></a>
    <line class="viz-row-sep" x1="40" y1="360" x2="240" y2="360"/>
    <a class="viz-link" href="../../mlops/opensearch/">
      <g class="viz-icon" transform="translate(54,375) scale(0.6)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15 L20 20"/></g>
      <text class="viz-field" x="80" y="387">Vector index</text></a>
  </g>

  <!-- development project (DATA family: table of linked ML assets) -->
  <g>
    <rect class="viz-kv-frame" x="320" y="150" width="200" height="300" rx="6"/>
    <path class="viz-kv-header" d="M320 156 a6 6 0 0 1 6 -6 h188 a6 6 0 0 1 6 6 v24 h-200 z"/>
    <text class="viz-kv-title" x="336" y="172">Development</text>
    <text class="viz-meta" x="504" y="172" text-anchor="end">private</text>
    <a class="viz-link" href="../../fs/feature_view/offline_api/">
      <g class="viz-icon" transform="translate(334,195) scale(0.6)"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9 H21 M12 9 V21"/></g>
      <text class="viz-field" x="360" y="207">Training Data</text></a>
    <line class="viz-row-sep" x1="320" y1="225" x2="520" y2="225"/>
    <!-- shared: Production's feature store, read into Development (aligned with Prod's FS row) -->
    <a class="viz-link" href="../../fs/feature_group/fg_overview/">
      <g class="viz-badge" data-tone="read"><rect x="326" y="231" width="188" height="33" rx="4" style="stroke-dasharray:4 3"/></g>
      <g data-tone="read"><g class="viz-icon" transform="translate(334,240) scale(0.6)"><rect x="8" y="8" width="12.5" height="13" rx="2"/><path d="M4.5 17 V6 A2 2 0 0 1 6.5 4 H15.5"/></g></g>
      <text class="viz-field" x="360" y="252">Prod Feature Store</text></a>
    <line class="viz-row-sep" x1="320" y1="270" x2="520" y2="270"/>
    <!-- Development's own feature store, highlighted so it reads as present alongside the shared one -->
    <a class="viz-link" href="../../fs/feature_group/fg_overview/">
      <g class="viz-badge" data-tone="accent"><rect x="326" y="276" width="188" height="33" rx="4"/></g>
      <g data-tone="accent"><g class="viz-icon" transform="translate(334,285) scale(0.6)"><rect x="8" y="8" width="12.5" height="13" rx="2"/><path d="M4.5 17 V6 A2 2 0 0 1 6.5 4 H15.5"/></g></g>
      <text class="viz-field" x="360" y="297">Feature Store</text>
      <text class="viz-field-role" x="506" y="297" text-anchor="end">own</text></a>
    <line class="viz-row-sep" x1="320" y1="315" x2="520" y2="315"/>
    <a class="viz-link" href="../../mlops/registry/">
      <g class="viz-icon" transform="translate(334,330) scale(0.6)"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M3 7 L12 12 L21 7 M12 12 V22"/></g>
      <text class="viz-field" x="360" y="342">Model Registry</text></a>
    <line class="viz-row-sep" x1="320" y1="360" x2="520" y2="360"/>
    <a class="viz-link" href="../../mlops/serving/">
      <g class="viz-icon" transform="translate(334,375) scale(0.6)"><rect x="4" y="5" width="16" height="6" rx="1.5"/><rect x="4" y="13" width="16" height="6" rx="1.5"/><path d="M7.5 8 H7.51 M7.5 16 H7.51"/></g>
      <text class="viz-field" x="360" y="387">Model Deployments</text></a>
    <line class="viz-row-sep" x1="320" y1="405" x2="520" y2="405"/>
    <a class="viz-link" href="../../mlops/opensearch/">
      <g class="viz-icon" transform="translate(334,420) scale(0.6)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15 L20 20"/></g>
      <text class="viz-field" x="360" y="432">Vector index</text></a>
  </g>

  <!-- Production's feature store read into Development, read-only, aligned with Prod's FS row -->
  <path class="viz-edge" d="M240 252 L326 252" marker-start="url(#st-knob)" marker-end="url(#st-arrow)" style="stroke-dasharray:5 4"/>
  <text class="viz-meta" x="283" y="243" text-anchor="middle" data-tone="read">read-only</text>
</svg>
</figure>
