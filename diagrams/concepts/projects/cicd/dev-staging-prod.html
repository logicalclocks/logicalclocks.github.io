<figure class="hops-diagram hops-viz hops-viz-static">
<svg viewBox="6 8 548 306" role="img" aria-label="Production, main, and development git branches each write to their own Hopsworks feature store, and features are promoted upward from dev to staging to production." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dsp-arrow" viewBox="0 0 11 11" refX="11" refY="5.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="viz-edge-arrow" d="M0 0 L11 5.5 L0 11 z"/>
    </marker>
    <marker id="dsp-knob" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle class="viz-edge-knob" cx="5" cy="5" r="3"/></marker>
  </defs>

  <!-- git branches -->
  <g><rect class="viz-node" x="20" y="40" width="230" height="56" rx="4"/>
  <text class="viz-node-title" x="135" y="73" text-anchor="middle">Production Branch</text></g>
  <g><rect class="viz-node" x="20" y="140" width="230" height="56" rx="4"/>
  <text class="viz-node-title" x="135" y="173" text-anchor="middle">Main Branch</text></g>
  <g><rect class="viz-node" x="20" y="240" width="230" height="56" rx="4"/>
  <text class="viz-node-title" x="135" y="273" text-anchor="middle">Development Branch</text></g>

  <!-- Hopsworks feature stores -->
  <rect class="viz-zone" x="300" y="28" width="248" height="280" rx="6"/>
  <text class="viz-label" x="312" y="22">Hopsworks</text>
  <g data-tone="accent"><rect class="viz-node" x="320" y="40" width="208" height="56" rx="4"/>
  <text class="viz-node-title" x="424" y="63" text-anchor="middle">Production</text>
  <text class="viz-node-title" x="424" y="81" text-anchor="middle">Feature Store</text></g>
  <g data-tone="accent"><rect class="viz-node" x="320" y="140" width="208" height="56" rx="4"/>
  <text class="viz-node-title" x="424" y="163" text-anchor="middle">Staging</text>
  <text class="viz-node-title" x="424" y="181" text-anchor="middle">Feature Store</text></g>
  <g data-tone="accent"><rect class="viz-node" x="320" y="240" width="208" height="56" rx="4"/>
  <text class="viz-node-title" x="424" y="263" text-anchor="middle">Dev</text>
  <text class="viz-node-title" x="424" y="281" text-anchor="middle">Feature Store</text></g>

  <!-- branch writes -->
  <path class="viz-edge" d="M250 68 H320" marker-end="url(#dsp-arrow)" marker-start="url(#dsp-knob)"/>
  <path class="viz-edge" d="M250 168 H320" marker-end="url(#dsp-arrow)" marker-start="url(#dsp-knob)"/>
  <path class="viz-edge" d="M250 268 H320" marker-end="url(#dsp-arrow)" marker-start="url(#dsp-knob)"/>

  <!-- promotion up -->
  <path class="viz-edge" d="M424 240 V196" marker-end="url(#dsp-arrow)" marker-start="url(#dsp-knob)"/>
  <path class="viz-edge" d="M424 140 V96" marker-end="url(#dsp-arrow)" marker-start="url(#dsp-knob)"/>
  <text class="viz-meta" x="434" y="122">promote</text>
</svg>
</figure>
