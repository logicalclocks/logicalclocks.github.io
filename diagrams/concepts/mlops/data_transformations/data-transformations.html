<figure class="hops-diagram hops-viz hops-viz-static">

  <defs>

  </defs>

  <g><rect class="viz-node" x="230" y="16" width="100" height="44" rx="4"/>

  <path class="viz-edge" d="M280 60 C280 82 102 82 102 100" marker-end="url(#tf-arrow)"/>

  </g>

  <g data-tone="data">
    <rect class="viz-node" x="372" y="100" width="172" height="74" rx="4"/>
