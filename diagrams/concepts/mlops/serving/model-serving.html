<svg viewBox="0 0 760 532" role="img" aria-label="Animated diagram of a KServe deployment on Hopsworks serving one prediction, in four numbered steps. 1: a device posts a prediction request with its id and device type through the Istio gateway to the transformer. 2: the transformer calls get_feature_vector with the id and the passed device feature; the online feature store returns the precomputed age and spend, and the transformer's feature table fills in, each feature marked as coming from the client or the store. 3: the assembled vector goes to the predictor, any Python framework, which returns 0.92 to the device. 4: inputs, transformed inputs and the prediction are logged to Kafka, while Prometheus scrapes metrics. A trace under the topology lists the four calls." xmlns="http://www.w3.org/2000/svg">
