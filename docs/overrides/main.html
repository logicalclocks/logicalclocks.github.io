{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <!-- Umami analytics (self-hosted at analytics.hops.io). Privacy-friendly,
       cookieless; defer so it never blocks rendering. -->
  <script defer src="https://analytics.hops.io/script.js" data-website-id="a34a4b7f-24c2-4a15-8e72-20ef615181bb"></script>
{% endblock %}

{% block outdated %}
You're not viewing the latest version of the documentation.
<a href="{{ '../' ~ base_url }}">
    <strong>Click here to go to latest.</strong>
</a>
<script>
    // A hacky way to recalculate positions of elements when the outdated banner is shown/hidden
    new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.attributeName === "hidden") {
                document.body.style.border = '1px solid transparent';
                setTimeout(function() { document.body.style.border = undefined; }, 1);
            }
        });
    }).observe(document.querySelector("[data-md-component=outdated]"), { attributes: true });
</script>
{% endblock %}
