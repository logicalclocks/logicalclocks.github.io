[project]
name = "hopsworks-docs-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing the Hopsworks documentation to AI agents."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "pyyaml>=6.0"]

[project.scripts]
hopsworks-docs-mcp = "hopsworks_docs_mcp:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hopsworks_docs_mcp"]
